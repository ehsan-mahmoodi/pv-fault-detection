[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvfault"
version = "0.1.0"
description = "String-level fault detection for utility-scale photovoltaic plants"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
pvfault = "pvfault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
